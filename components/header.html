<!-- ============================================================
     HEADER COMPONENT — Noviq
     Loaded dynamically by main.js into every page
     ============================================================ -->
<header class="header">

  <!-- Hamburger / Menu Toggle -->
  <button class="header-menu-btn" id="sidebarToggle" title="Toggle Sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Search -->
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="search-input"
      placeholder="Search anything..."
      autocomplete="off"
      spellcheck="false"
    />
    <span class="search-kbd">🔍</span>
  </div>

  <!-- Right Section -->
  <div class="header-right">

    <!-- Notifications -->
    <div class="header-notif" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-badge">8</span>
    </div>

    <!-- User -->
    <div class="header-user">
      <div class="user-info">
        <div class="user-name">Sachin</div>
        <div class="user-role">Admin</div>
      </div>
      <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>

  </div>

</header>
